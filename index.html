<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RST Team Jabin | Contributor Portal</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.top{background:linear-gradient(120deg,#142d55,#245da1);color:white;padding:34px max(22px,calc((100% - 1080px)/2)) 42px}.top small{opacity:.8;letter-spacing:.12em;text-transform:uppercase}.top h1{margin:8px 0;font-size:clamp(28px,5vw,42px)}.top p{margin:0;color:#dbeafe}.wrap{max-width:1080px;margin:-20px auto 60px;padding:0 20px}.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.nav button{border:1px solid #e0e7f0;border-radius:14px;background:white;padding:20px;text-align:left;cursor:pointer;box-shadow:0 8px 24px #1720330b;transition:.15s}.nav button:hover,.nav button.active{border-color:#3977c9;transform:translateY(-2px);box-shadow:0 10px 28px #245da122}.nav b{display:block;font-size:17px;margin:7px 0}.nav span{color:#64748b;font-size:13px}.ico{font-size:24px}.panel{margin-top:20px;background:white;border:1px solid #e1e8f0;border-radius:16px;padding:24px;box-shadow:0 8px 24px #17203308}.panel h2{margin:0 0 6px}.muted{color:#64748b}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.link{display:inline-block;padding:10px 15px;border-radius:9px;background:#245da1;color:white;text-decoration:none;font-weight:600;font-size:14px}.link.secondary{background:#edf4ff;color:#214f8b}.status{padding:12px;border-radius:9px;background:#f1f5f9;color:#475569;font-size:14px;margin-top:14px}.tablewrap{overflow:auto;max-height:520px;margin-top:16px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 12px;border-bottom:1px solid #e8edf3;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#f8fafc}.search{padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;width:min(100%,360px)}.foot{text-align:center;color:#94a3b8;font-size:12px;margin-top:22px}@media(max-width:600px){.panel{padding:17px}.top{padding-top:28px}}
</style></head><body><header class="top"><small>Contributor self-service</small><h1>RST Team Jabin</h1><p>Access your attendance, quality records, and centralized tracker responses.</p></header><main class="wrap"><nav class="nav" aria-label="Contributor sections"><button class="active" data-view="attendance"><div class="ico">🗓️</div><b>Attendance</b><span>View attendance information and open the team attendance page.</span></button><button data-view="quality"><div class="ico">✅</div><b>Quality</b><span>Review quality information and open the quality page.</span></button><button data-view="tracker"><div class="ico">📊</div><b>Centralized Tracker / Responses</b><span>Browse the published tracker data and search responses.</span></button></nav><section class="panel" aria-live="polite"><h2 id="heading">Attendance</h2><p class="muted" id="description">Open the attendance workspace using the team portal.</p><div class="actions" id="actions"></div><div id="content"></div></section><div class="foot">RST Team Jabin • Contributor Portal</div></main><script>
const APP_URL="https://script.google.com/a/macros/remotasks.com/s/AKfycbz0idN90pEOFTfWMYdMs0_3dE5rN2FhbXJRedM_VYNyarUQ-mLb5Y_PhmyGussq73RX7g/exec";
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSdXbqQMwQexp1zCBc_KlIFanBr9UoOaxyDL_3keNkKUvmuujQNTPPfhDdBeMg6NhlMp9i_1kINnjC1/pub?gid=138909060&single=true&output=csv";
const views={attendance:{title:"Attendance",desc:"View contributor attendance details.",url:CSV_URL,cta:"Open Published Source"},quality:{title:"Quality",desc:"Use the team’s published workspace to review quality information.",url:APP_URL,cta:"Open Quality Workspace"},tracker:{title:"Centralized Tracker / Responses",desc:"Live view of the published spreadsheet source. Data refreshes when you open this section.",url:CSV_URL,cta:"Open Published Source"}};
const $=s=>document.querySelector(s);let rows=[];
function link(href,label,cls="link"){const a=document.createElement("a");a.className=cls;a.href=href;a.target="_blank";a.rel="noopener noreferrer";a.textContent=label;return a}
function parseCSV(text){const out=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++}else if(c==='"'){quoted=!quoted}else if(c===","&&!quoted){row.push(cell);cell=""}else if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&n==="\n")i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=""}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))out.push(row);return out}
function show(view){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));const v=views[view];$("#heading").textContent=v.title;$("#description").textContent=v.desc;$("#actions").replaceChildren();if(view==="quality")$("#actions").append(link(v.url,v.cta));$("#content").replaceChildren();if(view==="tracker"||view==="attendance"){const status=document.createElement("div");status.className="status";status.textContent="Loading published spreadsheet…";$("#content").append(status);fetch(CSV_URL,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Source returned "+r.status);return r.text()}).then(t=>{rows=parseCSV(t);status.textContent="Loaded "+Math.max(0,rows.length-1)+" data rows.";if(view==="attendance")renderAttendance(rows,status);else{status.textContent+=" Use search to filter the table.";renderTable(rows)}}).catch(e=>{status.textContent="Could not load the spreadsheet in this browser. Open the published source above; if access is restricted, ask the team owner to enable public viewing. ("+e.message+")"})}else{const note=document.createElement("div");note.className="status";note.textContent="This portal links to the supplied Apps Script workspace. If that workspace uses a single landing page, choose the Attendance or Quality section inside it.";$("#content").append(note)}}
function renderAttendance(data,status){
const normalize=h=>String(h??"").replace(/^\uFEFF/,"").trim().toLowerCase().replace(/[\u2013\u2014_-]+/g," ").replace(/[^a-z0-9@ ]+/g," ").replace(/\\s+/g," ").trim();
const aliases={
email:["remotasks email","remotasks email address","email","email address","worker email"],
name:["tasker name","contributor","contributor name","worker name","name"],
shift:["trainer shift","shift","worker shift"],
attendance:["attendance status","attendance","attendance status "],
team:["worker team","team","workerteam"],
skill:["skill level","skill","skilllevel"]
};
const findHeaderRow=()=>{
for(let ri=0;ri<Math.min(data.length,20);ri++){
 const h=(data[ri]||[]).map(normalize);
 const hits=Object.values(aliases).filter(list=>list.some(a=>h.includes(normalize(a)))).length;
 if(hits>=3)return ri;
}
return 0;
};
const headerRow=findHeaderRow();
const headers=(data[headerRow]||[]).map(normalize);
const find=key=>aliases[key].map(normalize).map(a=>headers.indexOf(a)).find(i=>i>=0)??-1;
const email=find("email"),name=find("name"),shift=find("shift"),attendance=find("attendance"),team=find("team"),skill=find("skill");
const missing=[];
if(email<0&&name<0)missing.push("Remotasks Email or Tasker Name");
if(shift<0)missing.push("Trainer Shift");
if(attendance<0)missing.push("Attendance Status");
if(team<0)missing.push("Worker Team");
if(skill<0)missing.push("Skill Level");
if(missing.length){
 status.textContent="Attendance data could not be displayed. Could not identify: "+missing.join(", ")+". Detected headers: "+(data[headerRow]||[]).filter(Boolean).join(" | ");
 return;
}
const body=data.slice(headerRow+1);
const selected=[["Contributor","Shift","Attendance","Worker Team","Skill Level"],...body.map(r=>{
 const who=[name>=0?(r[name]||"").trim():"",email>=0?(r[email]||"").trim():""].filter(Boolean);
 return[who.join(" • "),r[shift]??"",r[attendance]??"",r[team]??"",r[skill]??""];
})];
status.textContent="Showing Contributor, Shift, Attendance, Worker Team, and Skill Level.";
const holder=document.createElement("div"),input=document.createElement("input"),tw=document.createElement("div"),table=document.createElement("table");
input.className="search";input.placeholder="Search attendance…";input.setAttribute("aria-label","Search attendance");tw.className="tablewrap";
function draw(q=""){
 table.replaceChildren();
 const filtered=[selected[0],...selected.slice(1).filter(r=>r.join(" ").toLowerCase().includes(q.toLowerCase()))];
 filtered.forEach((r,ri)=>{const tr=document.createElement("tr");r.forEach(v=>{const el=document.createElement(ri===0?"th":"td");el.textContent=v;tr.append(el)});table.append(tr)});
}
input.addEventListener("input",()=>draw(input.value));draw();tw.append(table);holder.append(input,tw);$("#content").append(holder)
}
function renderTable(data){const holder=document.createElement("div");const input=document.createElement("input");input.className="search";input.placeholder="Search tracker responses…";input.setAttribute("aria-label","Search tracker responses");const tw=document.createElement("div");tw.className="tablewrap";const table=document.createElement("table");function draw(q=""){table.replaceChildren();const filtered=[data[0],...data.slice(1).filter(r=>r.join(" ").toLowerCase().includes(q.toLowerCase()))];filtered.forEach((r,ri)=>{const tr=document.createElement("tr");r.forEach(c=>{const el=document.createElement(ri===0?"th":"td");el.textContent=c;tr.append(el)});table.append(tr)})}input.addEventListener("input",()=>draw(input.value));draw();tw.append(table);holder.append(input,tw);$("#content").append(holder)}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.view)));show("attendance");
</script></body></html>
