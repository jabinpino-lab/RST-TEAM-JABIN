<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RST Team Jabin | Contributor Portal</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.top{background:linear-gradient(120deg,#142d55,#245da1);color:white;padding:34px max(22px,calc((100% - 1080px)/2)) 42px}.top small{opacity:.8;letter-spacing:.12em;text-transform:uppercase}.top h1{margin:8px 0;font-size:clamp(28px,5vw,42px)}.top p{margin:0;color:#dbeafe}.wrap{max-width:1500px;margin:-20px auto 60px;padding:0 20px}.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.nav button{border:1px solid #e0e7f0;border-radius:14px;background:white;padding:20px;text-align:left;cursor:pointer;box-shadow:0 8px 24px #1720330b;transition:.15s}.nav button:hover,.nav button.active,.nav.button-link:hover{border-color:#3977c9;transform:translateY(-2px);box-shadow:0 10px 28px #245da122}.nav.button-link{display:block;border:1px solid #e0e7f0;border-radius:14px;background:white;padding:20px;text-align:left;cursor:pointer;box-shadow:0 8px 24px #1720330b;transition:.15s;text-decoration:none;color:inherit}.nav b{display:block;font-size:17px;margin:7px 0}.nav span{color:#64748b;font-size:13px}.ico{font-size:24px}.panel{margin-top:20px;background:white;border:1px solid #e1e8f0;border-radius:16px;padding:24px;box-shadow:0 8px 24px #17203308}.panel h2{margin:0 0 6px}.muted{color:#64748b}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.status{padding:12px;border-radius:9px;background:#f1f5f9;color:#475569;font-size:14px;margin-top:14px}.tablewrap{overflow:auto;max-height:520px;margin-top:16px}.resource-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:18px}.resource-card{display:flex;align-items:center;gap:14px;min-width:0;min-height:114px;padding:18px;border:1px solid #dce5f0;border-radius:14px;background:#fff;color:#172033;text-decoration:none;transition:border-color .15s,transform .15s,box-shadow .15s}.resource-card:hover{border-color:#3977c9;transform:translateY(-2px);box-shadow:0 8px 22px #245da11a}.resource-icon{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border-radius:10px;background:#eef4ff;color:#245da1;font-size:20px}.resource-copy{min-width:0}.resource-title{display:block;font-size:15px;line-height:1.35;font-weight:750;overflow-wrap:anywhere}.resource-detail{display:block;margin-top:5px;color:#64748b;font-size:12px;line-height:1.35;overflow-wrap:anywhere}.resource-open{display:block;margin-top:6px;color:#0756b5;font-size:12px;font-weight:500}.resource-search{margin-top:4px}@media(max-width:1150px){.resource-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.resource-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.resource-grid{grid-template-columns:1fr}}.embedded-app{display:block;width:100%;height:760px;border:1px solid #e1e8f0;border-radius:12px;background:white;margin-top:16px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 12px;border-bottom:1px solid #e8edf3;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#f8fafc}.search{padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;width:min(100%,360px)}.email-cell{font-weight:400}.email-cell small{display:block;font-size:12px;line-height:1.35}.email-cell .tasker-name{display:block;font-size:13px}.email-cell .tasker-email{display:block;font-weight:700}.shift-am{background:#fff3a6!important;font-weight:700}.shift-pm{background:#bfdbfe!important;font-weight:700}.attendance-remote{background:#bbf7d0!important;font-weight:700}.attendance-absent{background:#fecaca!important;font-weight:700}.quality-cell{font-weight:700}.quality-high{background:#bbf7d0!important}.quality-low{background:#fecaca!important}.foot{text-align:center;color:#94a3b8;font-size:12px;margin-top:22px}@media(max-width:600px){.panel{padding:17px}.top{padding-top:28px}}
</style></head><body><header class="top"><small>Contributor self-service</small><h1>RST Team Jabin</h1><p>Access your attendance, quality records, and centralized tracker responses.</p></header><main class="wrap"><nav class="nav" aria-label="Contributor sections"><button class="active" data-view="attendance"><div class="ico">🗓️</div><b>Attendance</b><span>View attendance information.</span></button><button data-view="quality"><div class="ico">✅</div><b>Quality</b><span>View contributor Quality %.</span></button><button data-view="tracker"><div class="ico">📊</div><b>Centralized Tracker / Responses</b><span>Browse the published tracker data and search responses.</span></button><button data-view="rubric"><div class="ico">📝</div><b>Reviewer Rubric Calculator</b><span>Show the reviewer rubric calculator below.</span></button><button data-view="dashboard"><div class="ico">📈</div><b>Production Dashboard</b><span>Show the RST CB production dashboard below.</span></button><button data-view="payout"><div class="ico">💰</div><b>Payout Calculator</b><span>Show the RST payout calculator below.</span></button></nav><section class="panel" aria-live="polite"><h2 id="heading">Attendance</h2><p class="muted" id="description">View contributor attendance details.</p><div class="actions" id="actions"></div><div id="content"></div></section><div class="foot">RST Team Jabin • Contributor Portal</div></main><script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSdXbqQMwQexp1zCBc_KlIFanBr9UoOaxyDL_3keNkKUvmuujQNTPPfhDdBeMg6NhlMp9i_1kINnjC1/pub?gid=138909060&single=true&output=csv";
const QUALITY_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSdXbqQMwQexp1zCBc_KlIFanBr9UoOaxyDL_3keNkKUvmuujQNTPPfhDdBeMg6NhlMp9i_1kINnjC1/pub?gid=802583584&single=true&output=csv";
const TRACKER_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSdXbqQMwQexp1zCBc_KlIFanBr9UoOaxyDL_3keNkKUvmuujQNTPPfhDdBeMg6NhlMp9i_1kINnjC1/pub?gid=1724237866&single=true&output=csv";
const views={attendance:{title:"Attendance",desc:"View contributor attendance details."},quality:{title:"Quality",desc:"View contributor Quality %."},tracker:{title:"Resources",desc:"Important RST Team resources and links. Search and open the resources below."},rubric:{title:"Reviewer Rubric Calculator",desc:"Use the reviewer rubric calculator below.",url:"https://ego-basic-reviewer-rubric-calculato.vercel.app/"},dashboard:{title:"Production Dashboard",desc:"View the RST CB production dashboard below.",url:"https://rst-cb-s-production-dashboard.vercel.app/"},payout:{title:"Payout Calculator",desc:"Use the RST payout calculator below.",url:"https://rst-payout-calculator.vercel.app/"}};
const $=s=>document.querySelector(s);let rows=[];
function parseCSV(text){const out=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++}else if(c==='"'){quoted=!quoted}else if(c===","&&!quoted){row.push(cell);cell=""}else if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&n==="\n")i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=""}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))out.push(row);return out}
function show(view){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));const v=views[view];$("#heading").textContent=v.title;$("#description").textContent=v.desc;$("#actions").replaceChildren();$("#content").replaceChildren();if(v.url){const frame=document.createElement("iframe");frame.src=v.url;frame.title=v.title;frame.className="embedded-app";frame.loading="lazy";frame.referrerPolicy="strict-origin-when-cross-origin";$("#content").append(frame);return}const status=document.createElement("div");status.className="status";status.textContent="Loading published spreadsheet…";$("#content").append(status);fetch(view==="quality"?QUALITY_CSV_URL:view==="tracker"?TRACKER_CSV_URL:CSV_URL,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Source returned "+r.status);return r.text()}).then(t=>{rows=parseCSV(t);if(view==="attendance"){status.textContent="Loaded "+Math.max(0,rows.length-1)+" data rows.";renderAttendance(rows,status)}else if(view==="quality"){renderQuality(rows,status)}else{status.textContent="Loaded "+Math.max(0,rows.length-1)+" data rows. Use search to filter the table.";renderTable(rows)}}).catch(e=>{status.textContent="Could not load the published spreadsheet in this browser. Please check that the sheet is published to the web and accessible without sign-in. ("+e.message+")"})}
function renderQuality(data,status){const normalize=h=>String(h??"").replace(/^\uFEFF/,"").trim().toLowerCase().replace(/[\u2013\u2014_-]+/g," ").replace(/[^a-z0-9% ]+/g," ").replace(/\s+/g," ").trim();const aliases={email:["remotasks email","remotasks email address","email","email address","worker email"],name:["tasker name","contributor","contributor name","worker name","name"],quality:["quality %","quality percentage","quality score","quality","quality percent","quality rate","overall score"]};let headerRow=0;for(let ri=0;ri<Math.min(data.length,20);ri++){const h=(data[ri]||[]).map(normalize);const hits=Object.values(aliases).filter(list=>list.some(a=>h.includes(normalize(a)))).length;if(hits>=2){headerRow=ri;break}}const headers=(data[headerRow]||[]).map(normalize);const find=key=>aliases[key].map(normalize).map(a=>headers.indexOf(a)).find(i=>i>=0)??-1;const email=find("email"),name=find("name"),quality=find("quality");if(quality<0){status.textContent="Quality % could not be displayed because no Quality % column was found in the published spreadsheet. Detected headers: "+(data[headerRow]||[]).filter(Boolean).join(" | ");return}const body=data.slice(headerRow+1);const selected=[["Contributor","Quality %"],...body.map(r=>{const who=[email>=0?(r[email]||"").trim():"",name>=0?(r[name]||"").trim():""].filter(Boolean);return[who.join(" • "),r[quality]??""]}).filter(r=>r[0]||r[1])];status.textContent="Showing contributor Quality %.";const holder=document.createElement("div"),input=document.createElement("input"),tw=document.createElement("div"),table=document.createElement("table");input.className="search";input.placeholder="Search quality…";input.setAttribute("aria-label","Search quality");tw.className="tablewrap";function draw(q=""){table.replaceChildren();const filtered=[selected[0],...selected.slice(1).filter(r=>r.join(" ").toLowerCase().includes(q.toLowerCase()))];filtered.forEach((r,ri)=>{const tr=document.createElement("tr");r.forEach((v,ci)=>{const el=document.createElement(ri===0?"th":"td");if(ri===0)el.textContent=v;else if(ci===0){el.className="email-cell";const parts=String(v).split(" • ");const e=parts[0]||"",n=parts.slice(1).join(" • ");const es=document.createElement("span");es.className="tasker-email";es.textContent=e;el.append(es);if(n){const ns=document.createElement("span");ns.className="tasker-name";ns.textContent=n;el.append(ns)}}else{el.textContent=v;el.className="quality-cell";const num=parseFloat(String(v).trim().replace("%",""));if(Number.isFinite(num)){if(num>=90)el.classList.add("quality-high");else if(num<80)el.classList.add("quality-low")}}tr.append(el)});table.append(tr)})}input.addEventListener("input",()=>draw(input.value));draw();tw.append(table);holder.append(input,tw);$("#content").append(holder)}
function renderAttendance(data,status){const normalize=h=>String(h??"").replace(/^\uFEFF/,"").trim().toLowerCase().replace(/[\u2013\u2014_-]+/g," ").replace(/[^a-z0-9@ ]+/g," ").replace(/\s+/g," ").trim();const aliases={email:["remotasks email","remotasks email address","email","email address","worker email"],name:["tasker name","contributor","contributor name","worker name","name"],shift:["trainer shift","shift","worker shift"],attendance:["attendance status","attendance"],team:["worker team","team","workerteam"],skill:["skill level","skill","skilllevel"]};const findHeaderRow=()=>{for(let ri=0;ri<Math.min(data.length,20);ri++){const h=(data[ri]||[]).map(normalize);const hits=Object.values(aliases).filter(list=>list.some(a=>h.includes(normalize(a)))).length;if(hits>=3)return ri}return 0};const headerRow=findHeaderRow(),headers=(data[headerRow]||[]).map(normalize),find=key=>aliases[key].map(normalize).map(a=>headers.indexOf(a)).find(i=>i>=0)??-1,email=find("email"),name=find("name"),shift=find("shift"),attendance=find("attendance"),team=find("team"),skill=find("skill"),missing=[];if(email<0&&name<0)missing.push("Remotasks Email or Tasker Name");if(shift<0)missing.push("Trainer Shift");if(attendance<0)missing.push("Attendance Status");if(team<0)missing.push("Worker Team");if(skill<0)missing.push("Skill Level");if(missing.length){status.textContent="Attendance data could not be displayed. Could not identify: "+missing.join(", ")+". Detected headers: "+(data[headerRow]||[]).filter(Boolean).join(" | ");return}const body=data.slice(headerRow+1),selected=[["Contributor","Shift","Attendance","Worker Team","Skill Level"],...body.map(r=>{const who=[email>=0?(r[email]||"").trim():"",name>=0?(r[name]||"").trim():""].filter(Boolean);return[who.join(" • "),r[shift]??"",r[attendance]??"",r[team]??"",r[skill]??""]})];status.textContent="Showing Contributor, Shift, Attendance, Worker Team, and Skill Level.";const holder=document.createElement("div"),input=document.createElement("input"),tw=document.createElement("div"),table=document.createElement("table");input.className="search";input.placeholder="Search attendance…";input.setAttribute("aria-label","Search attendance");tw.className="tablewrap";function draw(q=""){table.replaceChildren();const filtered=[selected[0],...selected.slice(1).filter(r=>r.join(" ").toLowerCase().includes(q.toLowerCase()))];filtered.forEach((r,ri)=>{const tr=document.createElement("tr");r.forEach((v,ci)=>{const el=document.createElement(ri===0?"th":"td");if(ri===0)el.textContent=v;else if(ci===0){el.className="email-cell";const parts=String(v).split(" • "),e=parts[0]||"",n=parts.slice(1).join(" • "),es=document.createElement("small");es.className="tasker-email";es.textContent=e;el.append(es);if(n){const ns=document.createElement("span");ns.className="tasker-name";ns.textContent=n;el.append(ns)}}else{el.textContent=v;if(ci===1){const s=String(v).trim().toLowerCase();if(s==="am"||s.includes(" am"))el.classList.add("shift-am");else if(s==="pm"||s.includes(" pm"))el.classList.add("shift-pm")}if(ci===2){const a=String(v).trim().toLowerCase();if(a==="remote"||a.includes("remote"))el.classList.add("attendance-remote");else if(a==="absent"||a.includes("absent"))el.classList.add("attendance-absent")}}tr.append(el)});table.append(tr)})}input.addEventListener("input",()=>draw(input.value));draw();tw.append(table);holder.append(input,tw);$("#content").append(holder)}
function renderTable(data){const holder=document.createElement("div"),input=document.createElement("input"),grid=document.createElement("div");input.className="search resource-search";input.placeholder="Search resources…";input.setAttribute("aria-label","Search resources");grid.className="resource-grid";const isUrl=v=>{const x=String(v).toLowerCase();return x.startsWith("https://")||x.startsWith("http://")};function draw(q=""){grid.replaceChildren();const query=q.trim().toLowerCase();data.slice(1).forEach(r=>{const cells=(r||[]).map(v=>String(v??"").trim()).filter(Boolean);if(!cells.length)return;const url=cells.find(isUrl);const title=cells.find(v=>v!==url)||"Resource";const details=cells.filter(v=>v!==title&&v!==url);if(query&&!cells.join(" ").toLowerCase().includes(query))return;const card=document.createElement(url?"a":"article");card.className="resource-card";if(url){card.href=url;card.target="_blank";card.rel="noopener noreferrer";card.setAttribute("aria-label","Open "+title)}const ico=document.createElement("span");ico.className="resource-icon";ico.textContent="🔗";ico.setAttribute("aria-hidden","true");const copy=document.createElement("span");copy.className="resource-copy";const heading=document.createElement("span");heading.className="resource-title";heading.textContent=title;copy.append(heading);if(details.length){const detail=document.createElement("span");detail.className="resource-detail";detail.textContent=details.slice(0,2).join(" · ");copy.append(detail)}if(url){const open=document.createElement("span");open.className="resource-open";open.textContent="Open Resource →";copy.append(open)}card.append(ico,copy);grid.append(card)});if(!grid.children.length){const empty=document.createElement("p");empty.className="muted";empty.textContent="No matching resources found.";grid.append(empty)}}input.addEventListener("input",()=>draw(input.value));draw();holder.append(input,grid);$("#content").append(holder)}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.view)));show("attendance");
</script></body></html>
