<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RST Team Jabin | Contributor Portal</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.top{background:linear-gradient(120deg,#142d55,#245da1);color:white;padding:34px max(22px,calc((100% - 1080px)/2)) 42px}.top small{opacity:.8;letter-spacing:.12em;text-transform:uppercase}.top h1{margin:8px 0;font-size:clamp(28px,5vw,42px)}.top p{margin:0;color:#dbeafe}.wrap{max-width:1080px;margin:-20px auto 60px;padding:0 20px}.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.nav button{border:1px solid #e0e7f0;border-radius:14px;background:white;padding:20px;text-align:left;cursor:pointer;box-shadow:0 8px 24px #1720330b;transition:.15s}.nav button:hover,.nav button.active{border-color:#3977c9;transform:translateY(-2px);box-shadow:0 10px 28px #245da122}.nav b{display:block;font-size:17px;margin:7px 0}.nav span{color:#64748b;font-size:13px}.ico{font-size:24px}.panel{margin-top:20px;background:white;border:1px solid #e1e8f0;border-radius:16px;padding:24px;box-shadow:0 8px 24px #17203308}.panel h2{margin:0 0 6px}.muted{color:#64748b}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.status{padding:12px;border-radius:9px;background:#f1f5f9;color:#475569;font-size:14px;margin-top:14px}.tablewrap{overflow:auto;max-height:520px;margin-top:16px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 12px;border-bottom:1px solid #e8edf3;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#f8fafc}.search{padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;width:min(100%,360px)}.email-cell{font-weight:400}.email-cell small{display:block;font-size:12px;line-height:1.35}.email-cell .tasker-name{display:block;font-size:13px}.email-cell .tasker-email{display:block;font-weight:700}.shift-am{background:#fff3a6!important;font-weight:700}.shift-pm{background:#bfdbfe!important;font-weight:700}.attendance-remote{background:#bbf7d0!important;font-weight:700}.attendance-absent{background:#fecaca!important;font-weight:700}.quality-cell{font-weight:700}.quality-high{background:#bbf7d0!important}.quality-low{background:#fecaca!important}.foot{text-align:center;color:#94a3b8;font-size:12px;margin-top:22px}@media(max-width:600px){.panel{padding:17px}.top{padding-top:28px}}
</style></head><body><header class="top"><small>Contributor self-service</small><h1>RST Team Jabin</h1><p>Access your attendance, quality records, and centralized tracker responses.</p></header><main class="wrap"><nav class="nav" aria-label="Contributor sections"><button class="active" data-view="attendance"><div class="ico">🗓️</div><b>Attendance</b><span>View attendance information.</span></button><button data-view="quality"><div class="ico">✅</div><b>Quality</b><span>View contributor Quality %.</span></button><button data-view="tracker"><div class="ico">📊</div><b>Centralized Tracker / Responses</b><span>Browse the published tracker data and search responses.</span></button></nav><section class="panel" aria-live="polite"><h2 id="heading">Attendance</h2><p class="muted" id="description">View contributor attendance details.</p><div class="actions" id="actions"></div><div id="content"></div></section><div class="foot">RST Team Jabin • Contributor Portal</div></main><script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSdXbqQMwQexp1zCBc_KlIFanBr9UoOaxyDL_3keNkKUvmuujQNTPPfhDdBeMg6NhlMp9i_1kINnjC1/pub?gid=138909060&single=true&output=csv";
const QUALITY_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSdXbqQMwQexp1zCBc_KlIFanBr9UoOaxyDL_3keNkKUvmuujQNTPPfhDdBeMg6NhlMp9i_1kINnjC1/pub?gid=802583584&single=true&output=csv";
const views={attendance:{title:"Attendance",desc:"View contributor attendance details."},quality:{title:"Quality",desc:"View contributor Quality %."},tracker:{title:"Centralized Tracker / Responses",desc:"Live view of the published spreadsheet source. Data refreshes when you open this section."}};
const $=s=>document.querySelector(s);let rows=[];
function parseCSV(text){const out=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++}else if(c==='"'){quoted=!quoted}else if(c===","&&!quoted){row.push(cell);cell=""}else if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&n==="\n")i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=""}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))out.push(row);return out}
function show(view){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));const v=views[view];$("#heading").textContent=v.title;$("#description").textContent=v.desc;$("#actions").replaceChildren();$("#content").replaceChildren();const status=document.createElement("div");status.className="status";status.textContent="Loading published spreadsheet…";$("#content").append(status);fetch(view==="quality"?QUALITY_CSV_URL:CSV_URL,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Source returned "+r.status);return r.text()}).then(t=>{rows=parseCSV(t);if(view==="attendance"){status.textContent="Loaded "+Math.max(0,rows.length-1)+" data rows.";renderAttendance(rows,status)}else if(view==="quality"){renderQuality(rows,status)}else{status.textContent="Loaded "+Math.max(0,rows.length-1)+" data rows. Use search to filter the table.";renderTable(rows)}}).catch(e=>{status.textContent="Could not load the published spreadsheet in this browser. Please check that the sheet is published to the web and accessible without sign-in. ("+e.message+")"})}
function renderQuality(data,status){const normalize=h=>String(h??"").replace(/^\uFEFF/,"").trim().toLowerCase().replace(/[\u2013\u2014_-]+/g," ").replace(/[^a-z0-9% ]+/g," ").replace(/\s+/g," ").trim();const aliases={email:["remotasks email","remotasks email address","email","email address","worker email"],name:["tasker name","contributor","contributor name","worker name","name"],quality:["quality %","quality percentage","quality score","quality","quality percent","quality rate"]};let headerRow=0;for(let ri=0;ri<Math.min(data.length,20);ri++){const h=(data[ri]||[]).map(normalize);const hits=Object.values(aliases).filter(list=>list.some(a=>h.includes(normalize(a)))).length;if(hits>=2){headerRow=ri;break}}const headers=(data[headerRow]||[]).map(normalize);const find=key=>aliases[key].map(normalize).map(a=>headers.indexOf(a)).find(i=>i>=0)??-1;const email=find("email"),name=find("name"),quality=find("quality");if(quality<0){status.textContent="Quality % could not be displayed because no Quality % column was found in the published spreadsheet. Detected headers: "+(data[headerRow]||[]).filter(Boolean).join(" | ");return}const body=data.slice(headerRow+1);const selected=[["Contributor","Quality %"],...body.map(r=>{const who=[email>=0?(r[email]||"").trim():"",name>=0?(r[name]||"").trim():""].filter(Boolean);return[who.join(" • "),r[quality]??""]}).filter(r=>r[0]||r[1])];status.textContent="Showing contributor Quality %.";const holder=document.createElement("div"),input=document.createElement("input"),tw=document.createElement("div"),table=document.createElement("table");input.className="search";input.placeholder="Search quality…";input.setAttribute("aria-label","Search quality");tw.className="tablewrap";function draw(q=""){table.replaceChildren();const filtered=[selected[0],...selected.slice(1).filter(r=>r.join(" ").toLowerCase().includes(q.toLowerCase()))];filtered.forEach((r,ri)=>{const tr=document.createElement("tr");r.forEach((v,ci)=>{const el=document.createElement(ri===0?"th":"td");if(ri===0)el.textContent=v;else if(ci===0){el.className="email-cell";const parts=String(v).split(" • ");const e=parts[0]||"",n=parts.slice(1).join(" • ");const es=document.createElement("span");es.className="tasker-email";es.textContent=e;el.append(es);if(n){const ns=document.createElement("span");ns.className="tasker-name";ns.textContent=n;el.append(ns)}}else{el.textContent=v;el.className="quality-cell";const num=parseFloat(String(v).trim().replace("%",""));if(Number.isFinite(num)){if(num>=90)el.classList.add("quality-high");else if(num<80)el.classList.add("quality-low")}}tr.append(el)});table.append(tr)})}input.addEventListener("input",()=>draw(input.value));draw();tw.append(table);holder.append(input,tw);$("#content").append(holder)}
function renderAttendance(data,status){const normalize=h=>String(h??"").replace(/^\uFEFF/,"").trim().toLowerCase().replace(/[\u2013\u2014_-]+/g," ").replace(/[^a-z0-9@ ]+/g," ").replace(/\s+/g," ").trim();const aliases={email:["remotasks email","remotasks email address","email","email address","worker email"],name:["tasker name","contributor","contributor name","worker name","name"],shift:["trainer shift","shift","worker shift"],attendance:["attendance status","attendance"],team:["worker team","team","workerteam"],skill:["skill level","skill","skilllevel"]};const findHeaderRow=()=>{for(let ri=0;ri<Math.min(data.length,20);ri++){const h=(data[ri]||[]).map(normalize);const hits=Object.values(aliases).filter(list=>list.some(a=>h.includes(normalize(a)))).length;if(hits>=3)return ri}return 0};const headerRow=findHeaderRow(),headers=(data[headerRow]||[]).map(normalize),find=key=>aliases[key].map(normalize).map(a=>headers.indexOf(a)).find(i=>i>=0)??-1,email=find("email"),name=find("name"),shift=find("shift"),attendance=find("attendance"),team=find("team"),skill=find("skill"),missing=[];if(email<0&&name<0)missing.push("Remotasks Email or Tasker Name");if(shift<0)missing.push("Trainer Shift");if(attendance<0)missing.push("Attendance Status");if(team<0)missing.push("Worker Team");if(skill<0)missing.push("Skill Level");if(missing.length){status.textContent="Attendance data could not be displayed. Could not identify: "+missing.join(", ")+". Detected headers: "+(data[headerRow]||[]).filter(Boolean).join(" | ");return}const body=data.slice(headerRow+1),selected=[["Contributor","Shift","Attendance","Worker Team","Skill Level"],...body.map(r=>{const who=[email>=0?(r[email]||"").trim():"",name>=0?(r[name]||"").trim():""].filter(Boolean);return[who.join(" • "),r[shift]??"",r[attendance]??"",r[team]??"",r[skill]??""]})];status.textContent="Showing Contributor, Shift, Attendance, Worker Team, and Skill Level.";const holder=document.createElement("div"),input=document.createElement("input"),tw=document.createElement("div"),table=document.createElement("table");input.className="search";input.placeholder="Search attendance…";input.setAttribute("aria-label","Search attendance");tw.className="tablewrap";function draw(q=""){table.replaceChildren();const filtered=[selected[0],...selected.slice(1).filter(r=>r.join(" ").toLowerCase().includes(q.toLowerCase()))];filtered.forEach((r,ri)=>{const tr=document.createElement("tr");r.forEach((v,ci)=>{const el=document.createElement(ri===0?"th":"td");if(ri===0)el.textContent=v;else if(ci===0){el.className="email-cell";const parts=String(v).split(" • "),e=parts[0]||"",n=parts.slice(1).join(" • "),es=document.createElement("small");es.className="tasker-email";es.textContent=e;el.append(es);if(n){const ns=document.createElement("span");ns.className="tasker-name";ns.textContent=n;el.append(ns)}}else{el.textContent=v;if(ci===1){const s=String(v).trim().toLowerCase();if(s==="am"||s.includes(" am"))el.classList.add("shift-am");else if(s==="pm"||s.includes(" pm"))el.classList.add("shift-pm")}if(ci===2){const a=String(v).trim().toLowerCase();if(a==="remote"||a.includes("remote"))el.classList.add("attendance-remote");else if(a==="absent"||a.includes("absent"))el.classList.add("attendance-absent")}}tr.append(el)});table.append(tr)})}input.addEventListener("input",()=>draw(input.value));draw();tw.append(table);holder.append(input,tw);$("#content").append(holder)}
function renderTable(data){const holder=document.createElement("div"),input=document.createElement("input"),tw=document.createElement("div"),table=document.createElement("table");input.className="search";input.placeholder="Search tracker responses…";input.setAttribute("aria-label","Search tracker responses");tw.className="tablewrap";function draw(q=""){table.replaceChildren();const filtered=[data[0],...data.slice(1).filter(r=>r.join(" ").toLowerCase().includes(q.toLowerCase()))];filtered.forEach((r,ri)=>{const tr=document.createElement("tr");r.forEach(c=>{const el=document.createElement(ri===0?"th":"td");el.textContent=c;tr.append(el)});table.append(tr)})}input.addEventListener("input",()=>draw(input.value));draw();tw.append(table);holder.append(input,tw);$("#content").append(holder)}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.view)));show("attendance");
</script></body></html>
